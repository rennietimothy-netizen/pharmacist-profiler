<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pharmacist professional capability profiler</title><style> *{box-sizing:border-box}body{margin:0;background:#f1f5f5;color:#18333b;font:17px/1.55 system-ui,sans-serif}main{max-width:850px;margin:30px auto;padding:30px;background:white;border-radius:16px}h1{font-size:clamp(25px,4vw,36px);line-height:1.15}h2{line-height:1.25}button{font:inherit;background:#075e65;color:white;border:0;border-radius:7px;padding:12px 20px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button.secondary{background:#e6eeee;color:#18333b}button:focus-visible,input:focus-visible{outline:3px solid #b56c00;outline-offset:4px}fieldset{border:0;border-bottom:1px solid #dce5e5;margin:0;padding:18px 0}legend{font-weight:600;padding-top:15px} .choices{display:flex;flex-wrap:wrap;gap:8px}.choices label{border:1px solid #aabdbd;border-radius:7px;padding:8px 12px;cursor:pointer}.choices label:has(input:checked){background:#d2eae7;border-color:#075e65} .nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}progress{width:100%;accent-color:#075e65}small,.muted{color:#49636a}.key{display:flex;flex-wrap:wrap;gap:10px;font-size:14px}.swatch{display:inline-block;width:15px;height:15px;border:1px solid #888;vertical-align:middle;margin-right:5px}svg{display:block;width:100%;max-width:650px;margin:auto}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:9px;border-bottom:1px solid #ddd} .note{background:#edf5f4;padding:15px;border-radius:8px} @media(max-width:600px){main{margin:0;padding:18px;border-radius:0}.choices label{padding:6px}}@media print{body{background:white}main{margin:0;padding:0;max-width:none}button,.nav{display:none}svg{max-width:440px}*{print-color-adjust:exact;-webkit-print-color-adjust:exact}}</style><main><div id="app"></div></main><script>
const domains=[
['Leadership and management',['I can demonstrate leadership within my professional role, regardless of my position or seniority.','I can influence and motivate others to achieve shared objectives.','I can effectively manage my workload, resources and competing priorities.','I can identify opportunities for improvement and contribute to implementing change in practice.','I can delegate tasks appropriately and support others in fulfilling their responsibilities.']],
['Collaborative working',['I can establish and maintain effective working relationships with other healthcare professionals.','I can contribute effectively to multidisciplinary discussions and decision-making.','I can recognise and draw upon the expertise of other professionals to improve patient care.','I can constructively manage disagreements and differences in professional opinion.','I can coordinate care with other professionals and services to support continuity of patient care.']],
['Communication and consultation skills',['I can conduct structured and effective patient consultations.','I can adapt my communication to meet the individual needs, preferences and health literacy of patients.','I can use active listening and appropriate questioning techniques to gather relevant information.','I can communicate complex clinical information in a clear and understandable manner.','I can manage sensitive or challenging conversations with patients, carers and colleagues.']],
['Professional accountability',['I can recognise the limits of my professional competence and seek appropriate support.','I can take responsibility for my professional decisions and justify my actions.','I can identify and manage ethical, legal and professional dilemmas in practice.','I can identify, report and respond appropriately to patient safety concerns and professional errors.','I can maintain appropriate professional standards, documentation and confidentiality in my practice.']],
['Education, research and evaluation',['I can identify my own learning needs and plan my continuing professional development.','I can support the learning and professional development of others.','I can provide constructive feedback to support improvements in professional practice.','I can undertake clinical audit or service evaluation to assess the quality of practice.','I can formulate research questions arising from practice and identify appropriate methods to investigate them.']],
['Resilience and adaptability',['I can manage pressure and competing demands while maintaining safe and effective practice.','I can adapt to changes in my professional role and working environment.','I can recognise and manage my emotional responses in challenging professional situations.','I can respond constructively to feedback, setbacks and mistakes.','I can recognise when I need support and take appropriate action to maintain my professional wellbeing.']],
['Applying clinical knowledge and skills',['I can apply my knowledge of disease processes, pharmacology and therapeutics to individual patient cases.','I can gather and interpret relevant clinical information to assess a patient’s healthcare needs.','I can identify and resolve actual or potential medicines-related problems.','I can develop appropriate, safe and effective treatment recommendations for individual patients.','I can monitor and evaluate treatment outcomes and identify when changes to treatment or referral are required.']],
['Person-centred care',['I can identify and respond to patients’ individual healthcare needs, values and priorities.','I can actively involve patients in decisions about their care and treatment.','I can tailor treatment recommendations to patients’ individual circumstances and preferences.','I can recognise and address barriers to accessing healthcare and using medicines effectively.','I can empower patients to manage their health and make informed decisions about their treatment.']],
['Evidence-informed decision making',['I can identify and access reliable sources of clinical evidence to inform my practice.','I can critically appraise the quality and relevance of published research.','I can interpret and apply clinical guidelines appropriately to individual patient circumstances.','I can integrate research evidence, clinical judgement and patient preferences when making decisions.','I can make informed professional decisions in situations where evidence is limited, uncertain or conflicting.']]];
const labels=['Not at all confident','Slightly confident','Moderately confident','Very confident','Extremely confident','Not applicable / insufficient experience'];const colors=['#d65b59','#ed9c56','#f2d477','#a1ce91','#27865e','#c4c9ca'];const bands=['Significant development opportunity','Development opportunity','Developing confidence','Perceived strength','Strong perceived capability','Insufficient information'];let order=[],answers={},page=0;const app=document.getElementById('app');function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){answers={};page=0;const pools=domains.map((d,i)=>shuffle(d[1].map((q,j)=>({q,d:i,id:i*5+j}))));order=[];for(let r=0;r<5;r++){let batch=shuffle(pools.map(p=>p[r]));if(order.length&&batch[0].d===order.at(-1).d)[batch[0],batch[1]]=[batch[1],batch[0]];order.push(...batch)}render()}function topFocus(){window.scrollTo(0,0);document.querySelector('h1').focus()}function intro(){app.innerHTML=`<p class="muted">Professional development • Self-assessment</p><h1 tabindex="-1">Pharmacist professional capability profiler</h1><p>We have developed this survey to help you explore your perceived strengths and identify opportunities for further professional development in relation to the nine domains of the Royal Pharmaceutical Society (RPS) Foundation Pharmacist Framework.</p><p>Reflect on your current professional practice and indicate how confident you feel in undertaking each activity. There are no right or wrong answers. Please respond honestly, rather than according to what you think might be expected of you.</p><p>On completion, you will receive a personalised visual profile of your perceived capabilities to help inform your learning and continuing professional development.</p><div class="note"><strong>45 statements · approximately 8–10 minutes</strong><p>This is a formative reflection tool, not a validated assessment of competence. Your responses are processed in your browser and are not transmitted or stored by this tool. You can print or save your results as a PDF. Closing or refreshing the page will clear your responses.</p></div><p>Framework attribution: RPS Foundation Pharmacist Framework (2019). The survey statements are independently developed and are not official RPS assessment items.</p><button onclick="start()">Begin self-assessment</button>`}function render(){let chunk=order.slice(page*5,page*5+5);app.innerHTML=`<h1 tabindex="-1">Self-assessment</h1><p>Page ${page+1} of 9 · <span id="count">${Object.keys(answers).length}</span> of 45 answered</p><progress id="progress" max="45" value="${Object.keys(answers).length}" aria-label="Questions answered"></progress><p>How confident are you in your ability to undertake each of the following activities?</p><div class="note key">${labels.map((l,i)=>`<span><strong>${i===5?'N/A':i+1}</strong> – ${l}</span>`).join('')}</div>${chunk.map((o,i)=>`<fieldset><legend>${page*5+i+1}. ${o.q}</legend><div class="choices">${labels.map((l,j)=>`<label><input type="radio" name="q${o.id}" value="${j+1}" ${answers[o.id]===j+1?'checked':''} onchange="answer(${o.id},${j+1})" aria-label="${l}"> ${j===5?'N/A':j+1}</label>`).join('')}</div></fieldset>`).join('')}<div class="nav"><button class="secondary" onclick="back()">${page?'Back':'Introduction'}</button><button id="next" onclick="next()" ${chunk.every(o=>answers[o.id])?'':'disabled'}>${page===8?'View my profile':'Next'}</button></div>`;topFocus()}function answer(id,v){answers[id]=v;document.getElementById('count').textContent=Object.keys(answers).length;document.getElementById('progress').value=Object.keys(answers).length;document.getElementById('next').disabled=!order.slice(page*5,page*5+5).every(o=>answers[o.id])}function back(){if(page){page--;render()}else{intro();app.insertAdjacentHTML('beforeend',' <button class="secondary" onclick="render()">Resume assessment</button>');topFocus()}}function next(){if(!order.slice(page*5,page*5+5).every(o=>answers[o.id]))return;if(page<8){page++;render()}else results()}
function results(){const scores=domains.map((d,i)=>{let a=d[1].map((_,j)=>answers[i*5+j]).filter(v=>v>=1&&v<=5);return {name:d[0],n:a.length,v:a.length>=3?a.reduce((x,y)=>x+y,0)/a.length:null,i}});const band=v=>v===null?5:Math.round(v)-1;const lines=[['Leadership and','management'],['Collaborative','working'],['Communication and','consultation skills'],['Professional','accountability'],['Education, research','and evaluation'],['Resilience and','adaptability'],['Applying clinical','knowledge and skills'],['Person-centred','care'],['Evidence-informed','decision making']];const pt=(r,a)=>[250+r*Math.cos(a*Math.PI/180),250+r*Math.sin(a*Math.PI/180)];let wheel=scores.map((s,i)=>{let a=-90+i*40,b=a+40,p=pt(242,a),q=pt(242,b),r=pt(82,b),t=pt(82,a),m=pt(164,a+20),k=band(s.v),fill=k===4?'white':'#18292c';return `<path d="M${p} A242 242 0 0 1 ${q} L${r} A82 82 0 0 0 ${t} Z" fill="${colors[k]}" stroke="white" stroke-width="2"/>${lines[i].map((l,j)=>`<text x="${m[0]}" y="${m[1]-12+j*14}" text-anchor="middle" font-size="11" font-weight="600" fill="${fill}">${l}</text>`).join('')}<text x="${m[0]}" y="${m[1]+24}" text-anchor="middle" font-size="20" font-weight="bold" fill="${fill}">${s.v===null?'N/A':s.v.toFixed(1)}</text>`}).join('');let ranked=scores.slice().sort((a,b)=>(a.v??99)-(b.v??99));let radar=[1,2,3,4,5].map(v=>`<polygon points="${scores.map((s,i)=>pt(v*36,-90+i*40).join(',')).join(' ')}" fill="none" stroke="#b8c9ca"/>`).join('')+scores.map((s,i)=>{let p=pt(180,-90+i*40),l=pt(204,-90+i*40);return `<line x1="250" y1="250" x2="${p[0]}" y2="${p[1]}" stroke="#b8c9ca"/><text x="${l[0]}" y="${l[1]+5}" text-anchor="middle" font-size="14">${i+1}</text>`}).join('');if(scores.every(s=>s.v!==null))radar+=`<polygon points="${scores.map((s,i)=>pt(s.v*36,-90+i*40).join(',')).join(' ')}" fill="#087e83" fill-opacity=".2" stroke="#087e83" stroke-width="3"/>`;else radar+=scores.filter(s=>s.v!==null).map(s=>{let p=pt(s.v*36,-90+s.i*40);return `<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="#087e83"/>`}).join('');app.innerHTML=`<h1 tabindex="-1">Your professional capability profile</h1><p>Your results reflect your self-perceived confidence, not demonstrated competence. Use them to reflect on your learning needs in the context of your role.</p><svg viewBox="0 0 500 500" role="img" aria-label="Circular heat map; scores are also listed in the table below">${wheel}<text x="250" y="239" text-anchor="middle" font-size="14" font-weight="bold">MY CAPABILITY</text><text x="250" y="258" text-anchor="middle" font-size="14" font-weight="bold">PROFILE</text></svg><div class="key">${bands.map((b,i)=>`<span><i class="swatch" style="background:${colors[i]}"></i>${b}</span>`).join('')}</div><h2>Domain scores — lowest confidence first</h2><table><thead><tr><th>Domain</th><th>Mean / 5</th><th>Valid items</th></tr></thead><tbody>${ranked.map(s=>`<tr><td>${s.i+1}. ${s.name}</td><td><i class="swatch" style="background:${colors[band(s.v)]}"></i>${s.v===null?'N/A':s.v.toFixed(1)}</td><td>${s.n}/5</td></tr>`).join('')}</tbody></table><h2>Radar profile</h2><svg viewBox="0 0 500 500" role="img" aria-label="Radar profile with numbered domains corresponding to the table">${radar}</svg><p class="muted">Axes correspond to the domain numbers in the table; the outer ring represents 5. Missing domains are not scored.</p><h2>Planning your development</h2><p>Consider the lowest-scoring domains alongside their relevance to your current or future role. Identify one or two learning objectives and discuss them with a mentor or colleague where appropriate.</p><p class="muted">Each domain is the mean of its valid responses; at least three of five are required. N/A responses are excluded. Colour bands use the nearest whole score (half points round up). This independently developed questionnaire has not been validated.</p><div class="nav"><button class="secondary" onclick="page=8;render()">Review responses</button><button onclick="window.print()">Print / save PDF</button><button class="secondary" onclick="if(confirm('Clear all responses and start again?')){answers={};order=[];intro()}">Start again</button></div>`;topFocus()}intro();</script></html>
